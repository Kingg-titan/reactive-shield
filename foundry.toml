[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = true
ffi = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./logs" }
]

[profile.ci]
verbosity = 3
fuzz = { runs = 10000 }

[rpc_endpoints]
eth_sepolia = "${ETH_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"
reactive_lasna = "${REACTIVE_LASNA_RPC_URL}"
